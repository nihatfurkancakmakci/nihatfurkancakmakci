<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="362" viewBox="0 0 1200 362" role="img" aria-label="Projects">
<rect x="1" y="1" width="1198" height="360" rx="10" fill="#f4f1ea" stroke="#d9d3c5" stroke-width="2"/>
<rect x="1" y="1" width="8" height="360" rx="4" fill="#c2410c"/>
<text x="52" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#14181f">Projects</text>
<text x="52" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14181f">Hotel assistant (client project, private)</text>
<text x="52" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2b323c">Written and voice assistant for hotel managers. I built the voice side, the operations setup and the</text>
<text x="52" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2b323c">sign-in system, and I helped choose the AI provider after comparing cost and quality. It started as a</text>
<text x="52" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2b323c">prototype and now runs live.</text>
<text x="52" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14181f">Crypto forecasting system (personal project)</text>
<text x="52" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2b323c">Combines three kinds of models, including one that reads news sentiment, to forecast prices. A local</text>
<text x="52" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2b323c">language model explains the market in plain words, and a web dashboard shows everything.</text>
