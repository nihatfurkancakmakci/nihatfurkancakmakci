<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" role="img" aria-label="footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.6" stop-color="#0f1d3d"/>
      <stop offset="1" stop-color="#0c4a5e"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="40" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="40" fill="url(#bg)"/>
    <circle cx="0" cy="20" r="3" fill="#38bdf8"><animate attributeName="cx" values="-10;1210" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
